<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlayable 백엔드 접근 권한</title>
  <link rel="stylesheet" href="permissions.css">
</head>
<body>
  <main>
    <h1>백엔드 접근 허용</h1>
    <p>Overlayable이 다음 서버에 연결하려면 호스트 접근 권한이 필요합니다.</p>
    <p id="server"></p>
    <p>Chrome의 호스트 권한은 이 호스트의 모든 포트에 적용됩니다. 실제 API 요청에는 입력한 포트를 사용합니다.</p>
    <p id="warning"></p>
    <button id="allow" disabled>접근 허용</button>
    <p id="status" role="status">허용 후 geojson.io로 돌아가 연결을 다시 누르세요. 이 탭을 닫으면 요청을 취소할 수 있습니다.</p>
  </main>
  <script src="permissions.js"></script>
</body>
</html>
